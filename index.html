<style>

:root{
  /* Layout: one phone-width column; summary on top, big tap targets, bottom tab bar + one add button. */
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#E8EFE9; --ink:#17251C; --muted:#5A6A5F; --line:#D5DFD7;
  --accent:#2F7D4F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE2;
  --amber:#9C6410; --amber-soft:#FBEFD5;
  --good:#1D7443; --bad:#B3261E; --bad-soft:#FBE3E1; --warn:#8F5300; --warn-soft:#FFEBC7;
  --font-body:"Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
  --font-display:"Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1712; --surface:#17221B; --surface-2:#1F2C24; --ink:#E6EEE8; --muted:#9FB0A5; --line:#2B3B31;
    --accent:#5CC189; --accent-ink:#0B130E; --accent-soft:#1D3828;
    --amber:#F2B84B; --amber-soft:#3A2E14;
    --good:#6FD39B; --bad:#FF8A80; --bad-soft:#3D1F1C; --warn:#FFC266; --warn-soft:#3A2A10;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:10px;flex:none}
.top h1{font-size:20px;font-weight:600}
.top p{margin:0;color:var(--muted);font-size:14px}
.banner{border-radius:var(--r);padding:12px 14px;margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 200px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--ink)}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;margin:8px 0 14px}
.hero .eyebrow{margin:0;font-size:15px;opacity:.9}
.hero .big{margin:2px 0 4px;font-size:44px;font-weight:600;line-height:1.1}
.hero .big small{font-size:20px;font-weight:400}
.hero .sub{margin:0;font-size:15px;opacity:.92}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 6px;font-size:16px;font-weight:600;cursor:pointer}
.act svg{width:28px;height:28px}
.act:active{transform:scale(.98)}
.act.exp svg{color:var(--bad)} .act.inc svg{color:var(--good)} .act.egg svg{color:var(--amber)} .act.flock svg{color:var(--accent)} .act.vac svg{color:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 14px}
.card h2{font-size:18px;font-weight:600;margin-bottom:10px}
.card p{margin:0 0 8px}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat .k{font-size:14px;color:var(--muted);display:block}
.stat .v{font-size:19px;font-weight:600;display:block;word-break:break-word}
.stat.wide{grid-column:span 3}
.pos{color:var(--good)} .neg{color:var(--bad)}
.line-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.line-item:first-of-type{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.exp i{background:var(--bad)} .bar.inc i{background:var(--good)}

.alert{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.alert.soon{background:var(--warn-soft);color:var(--warn)}
.alert.late{background:var(--bad-soft);color:var(--bad)}
.alert div{flex:1}
.alert strong{display:block;color:var(--ink)}

.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 140px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.monthnav h2{font-size:20px;font-weight:600;text-align:center;flex:1}
.monthnav .btn{min-width:52px;font-size:22px;line-height:1}
.monthnav .btn:disabled{opacity:.35}
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.filter button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{font-size:15px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.entries{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.entry{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.entry .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.entry .ic svg{width:22px;height:22px}
.ic.exp{background:var(--bad-soft);color:var(--bad)} .ic.inc{background:var(--accent-soft);color:var(--good)} .ic.egg{background:var(--amber-soft);color:var(--amber)} .ic.flock{background:var(--accent-soft);color:var(--accent)} .ic.vac{background:var(--warn-soft);color:var(--warn)}
.entry .tx{flex:1;min-width:0}
.entry .tx b{display:block;font-weight:600}
.entry .tx span{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.entry .amt{font-weight:600;white-space:nowrap}
.tasks .task{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}
.tasks .task:first-of-type{border-top:0;padding-top:0}
.tasks .task p{margin:0;flex:1}
.tasks .task.warn p{color:var(--warn)}
.batch{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:0;border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.batch .tx{flex:1;min-width:0}
.batch .tx b{display:block}
.batch .tx span{display:block;color:var(--muted);font-size:14px}
.batch .cnt{font-size:24px;font-weight:600;white-space:nowrap}
.batch .cnt small{font-size:14px;font-weight:400;margin-left:2px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

.month-card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.month-card .head h2{margin:0}
.month-card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.month-card dt{color:var(--muted)} .month-card dd{margin:0;text-align:right;font-weight:600}

label.field{display:block;margin:0 0 12px}
label.field > span{display:block;font-weight:600;margin-bottom:4px}
label.field small{display:block;color:var(--muted);font-weight:400}
input[type=text],input[type=date],input:not([type]){width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:18px}
input:focus{border-color:var(--accent)}
fieldset.chips{border:0;padding:0;margin:0 0 12px}
fieldset.chips legend{font-weight:600;margin-bottom:6px;padding:0}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.chip-btn{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip input:focus-visible + span{outline:3px solid var(--amber);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);min-height:1.5em;margin:0 0 6px;font-weight:600}
.hint{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:15px;margin:0 0 12px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--muted);min-height:60px;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:11;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));min-height:56px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:18px;padding:0 22px 0 16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(20,60,35,.28);cursor:pointer}
.fab svg{width:26px;height:26px}

.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,14,.45);opacity:0;transition:opacity .18s}
.overlay.open{opacity:1}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .18s}
.overlay.open .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-14px -16px 12px;padding:14px 16px 8px;position:sticky;top:-14px;z-index:2;background:var(--bg)}
.sheet-h h2{font-size:21px;font-weight:600}
.x{border:0;background:var(--surface-2);border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
.pick{display:grid;gap:10px}
.pick .act{flex-direction:row;justify-content:flex-start;min-height:64px;padding:10px 16px;font-size:18px;gap:14px}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .primary{flex:1}
.dialog .sheet{border-radius:20px;margin:16px;max-width:440px}
.dialog{align-items:center}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.onb{max-width:560px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px 40px}
.onb .logo{width:72px;height:72px;border-radius:18px}
.onb h1{font-size:28px;font-weight:600;margin:12px 0 4px}
footer.note{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
/* ---- v2.1 look ---- */
body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--bg) 220px) no-repeat,var(--bg)}
.top{background:transparent;backdrop-filter:blur(8px)}
.card{border:0;box-shadow:0 1px 2px rgba(20,50,30,.06),0 4px 14px rgba(20,50,30,.06)}

.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .age{background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px;font-size:14px}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;position:relative;z-index:1}

.tag.pos{background:var(--accent-soft);color:var(--good)} .tag.neg{background:var(--bad-soft);color:var(--bad)}
.ms-big{font-size:34px;font-weight:600;margin:2px 0 8px}
.ms .stats{margin-top:6px}
.bar{height:10px;border-radius:5px}

.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}

.chart span{font-size:13px;color:var(--muted)}
i.inc{background:var(--good)} i.exp{background:var(--bad)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tabs{box-shadow:0 -4px 16px rgba(20,50,30,.06);border-top:0}
.tabs button svg{padding:3px 16px;border-radius:999px;box-sizing:content-box}
.tabs button[aria-current="page"] svg{background:var(--accent-soft)}
.entry{border:0;box-shadow:0 1px 2px rgba(20,50,30,.06)}
.sheet{box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#246B41,#17492C)} .card,.act,.entry{box-shadow:none;border:1px solid var(--line)}}
@media (max-width:360px){.actions{grid-template-columns:repeat(2,1fr)} .stats{grid-template-columns:1fr 1fr} .stat.wide{grid-column:span 2} .hero .big{font-size:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

"use strict";

/* ---------- fixed lists ---------- */
const KEY = "hkh.v1";

/* ---------- helpers ---------- */
const nf = new Intl.NumberFormat("bn-BD", { maximumFractionDigits: 2 });
const fmt = (v) => nf.format(v);
const tk = (v) => "৳ " + nf.format(Math.round(v));
const dLong = new Intl.DateTimeFormat("bn-BD", { day: "numeric", month: "long", year: "numeric" });
const dDay = new Intl.DateTimeFormat("bn-BD", { day: "numeric", month: "long", weekday: "long" });
const dMonth = new Intl.DateTimeFormat("bn-BD", { month: "long", year: "numeric" });
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const monthOf = (s) => s.slice(0, 7);
const curMonth = () => monthOf(todayISO());
const monthLabel = (ym) => { const [y, m] = ym.split("-").map(Number); return dMonth.format(new Date(y, m - 1, 1)); };
const shiftMonth = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const BN = "০১২৩৪৫৬৭৮৯";
const toNum = (v) => { const s = String(v == null ? "" : v).trim().replace(/[০-৯]/g, (d) => BN.indexOf(d)).replace(/,/g, ""); if (s === "") return NaN; const x = Number(s); return Number.isFinite(x) ? x : NaN; };
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const $ = (id) => document.getElementById(id);

/* ---------- storage (on this phone only) ---------- */
let state = null;

function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOK = false; return null; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) { storageOK = false; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then((p) => { if (!p) navigator.storage.persist(); }); } catch (e) { /* ignore */ }
}

/* ---------- calculations ---------- */
function totals(list) {
  const t = { add: 0, dead: 0, sold: 0, eaten: 0, exp: 0, inc: 0, eggs: 0, broken: 0 };
  for (const e of list) {
    if (e.t === "exp") t.exp += e.amount || 0;
    else if (e.t === "inc") t.inc += e.amount || 0;
    else if (e.t === "egg") { t.eggs += e.count || 0; t.broken += e.broken || 0; }
    else if (e.t === "flock" && e.kind in t) t[e.kind] += e.n || 0;
  }
  t.now = t.add - t.dead - t.sold - t.eaten;
  t.profit = t.inc - t.exp;
  t.good = t.eggs - t.broken;
  return t;
}
const inMonth = (ym) => state.entries.filter((e) => monthOf(e.d) === ym);
const batchById = (id) => state.batches.find((b) => b.id === id) || null;
const multi = () => state.batches.length > 1;
function batchNow(id, skipId) {
  return totals(state.entries.filter((e) => e.t === "flock" && e.b === id && e.id !== skipId)).now;
}
function batchAge(b) {
  if (!b || !isDate(b.date)) return null;
  const d = daysBetween(b.date, todayISO()) + (b.age || 0);
  return d >= 0 ? d : null;
}
const liveBatches = () => state.batches.filter((b) => batchNow(b.id) > 0);
function defaultBatch() { const l = liveBatches(); return l.length === 1 ? l[0].id : state.batches.length === 1 ? state.batches[0].id : ""; }
function bnCount(n) { return fmt(n); }
function todayTasks() {
  const today = todayISO();
  const tasks = [];
  const todays = state.entries.filter((e) => e.d === today);
  const eggToday = todays.some((e) => e.t === "egg");
  const eggRecent = state.entries.some((e) => e.t === "egg" && daysBetween(e.d, today) <= 14);
  const layingAge = state.batches.some((b) => batchNow(b.id) > 0 && (batchAge(b) || 0) >= 120);
  if (!eggToday && (eggRecent || layingAge)) tasks.push({ text: "আজ কয়টি ডিম পেলেন, এখনো লেখা হয়নি।", btn: "ডিম লিখুন", act: "form", type: "egg" });
  if (!todays.length && new Date().getHours() >= 15) tasks.push({ text: "আজ এখনো কিছু লেখা হয়নি। খাবার কিনলে, হাঁস মারা গেলে বা বিক্রি হলে লিখে রাখুন।", btn: "লিখুন", act: "pick" });
  const last = state.settings.lastBackup;
  if (state.entries.length > 1 && (!last || daysBetween(last, today) >= 7)) tasks.push({ text: (last ? fmt(daysBetween(last, today)) + " দিন ব্যাকআপ নেওয়া হয়নি।" : "এখনো কোনো ব্যাকআপ নেওয়া হয়নি।") + " ফোন হারালে হিসাব হারাবে।", btn: "ব্যাকআপ নিন", act: "backupShare", warn: true });
  return tasks;
}
function ageText(days) {
  if (days == null) return "";
  const w = Math.floor(days / 7), d = days % 7;
  if (!w) return fmt(d) + " দিন";
  return fmt(w) + " সপ্তাহ" + (d ? " " + fmt(d) + " দিন" : "");
}
function vacAlerts() {
  const today = todayISO();
  return state.entries
    .filter((e) => e.t === "vac" && isDate(e.next) && !e.done)
    .map((e) => ({ e, left: daysBetween(today, e.next) }))
    .filter((x) => x.left <= 7)
    .sort((a, b) => a.left - b.left);
}
function sortedEntries(list) {
  return list.slice().sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : (b.c || 0) - (a.c || 0)));
}

function saveBatch() {
  const name = val("b-name").slice(0, 40);
  const d = val("b-date");
  const age = toNum(val("b-age") || "0");
  if (!name) return formError("ব্যাচের নাম দিন।");
  if (state.batches.some((x) => x.name === name && (!editingBatch || x.id !== editingBatch.id))) return formError("এই নামে আরেকটি ব্যাচ আছে।");
  if (!isDate(d) || d > todayISO()) return formError("সঠিক তারিখ দিন।");
  if (!(age >= 0)) return formError("বয়স শুধু সংখ্যায় লিখুন।");
  if (editingBatch) {
    Object.assign(editingBatch, { name, date: d, age: Math.round(age) });
    persist(); closeSheet(); render(); toast("সেভ হয়েছে");
    return;
  }
  const count = toNum(val("b-count"));
  if (!(count > 0) || !Number.isInteger(count)) return formError("কয়টি হাঁস / বাচ্চা তা লিখুন।");
  const costRaw = val("b-cost"); const cost = costRaw ? toNum(costRaw) : 0;
  if (costRaw && !(cost > 0)) return formError("দাম শুধু সংখ্যায় লিখুন।");
  const b = { id: uid(), name, date: d, age: Math.round(age) };
  state.batches.push(b);
  state.entries.push({ id: uid(), c: Date.now(), t: "flock", d, b: b.id, kind: "add", n: count, note: "নতুন ব্যাচ" });
  if (cost) state.entries.push({ id: uid(), c: Date.now() + 1, t: "exp", d, cat: "হাঁস / বাচ্চা কেনা", amount: Math.round(cost * 100) / 100, qty: count, unit: "টি", note: name });
  persist(); closeSheet(); render(); toast(name + " যোগ হয়েছে");
}

function entryView(e) {
  let title = "", sub = [], amt = "", amtCls = "";
  if (e.t === "exp" || e.t === "inc") {
    title = e.cat;
    if (e.qty) sub.push(fmt(e.qty) + " " + (e.unit || ""));
    if (e.note) sub.push(e.note);
    amt = (e.t === "exp" ? "− " : "+ ") + tk(e.amount);
    amtCls = e.t === "exp" ? "neg" : "pos";
  } else if (e.t === "egg") {
    title = "ডিম পাওয়া গেছে " + fmt(e.count) + "টি";
    if (e.broken) sub.push("ভাঙা / নষ্ট " + fmt(e.broken) + "টি");
    if (e.note) sub.push(e.note);
  } else if (e.t === "flock") {
    title = FLOCK[e.kind] + " — " + fmt(e.n) + "টি";
    if (e.note) sub.push(e.note);
    amtCls = e.kind === "add" ? "pos" : "neg";
    amt = (e.kind === "add" ? "+" : "−") + fmt(e.n);
  } else if (e.t === "vac") {
    title = e.name;
    if (e.n) sub.push(fmt(e.n) + "টি হাঁসকে");
    if (isDate(e.next)) sub.push("পরের ডোজ " + dLong.format(parseISO(e.next)) + (e.done ? " (দেওয়া হয়েছে)" : ""));
    if (e.note) sub.push(e.note);
  }
  if ((e.t === "flock" || e.t === "vac") && multi() && batchById(e.b)) sub.unshift(batchById(e.b).name);
  return '<li><button type="button" class="entry" data-act="edit" data-id="' + e.id + '"><span class="ic ' + e.t + '">' + ICON[e.t] + '</span><span class="tx"><b>' + esc(title) + "</b>" + (sub.length ? "<span>" + esc(sub.join(" · ")) + "</span>" : "") + '</span><span class="amt ' + amtCls + '">' + esc(amt) + "</span></button></li>";
}

/* ---------- form building ---------- */
function field(id, label, value, kind, hint) {
  const v = value == null ? "" : value;
  const input = kind === "date"
    ? '<input type="date" id="' + id + '" value="' + esc(v) + '">'
    : kind === "num"
      ? '<input type="text" inputmode="decimal" autocomplete="off" id="' + id + '" value="' + esc(v) + '">'
      : '<input type="text" autocomplete="off" id="' + id + '" value="' + esc(v) + '">';
  return '<label class="field" for="' + id + '"><span>' + esc(label) + (hint ? "<small>" + esc(hint) + "</small>" : "") + "</span>" + input + "</label>";
}
function chips(name, legend, options, value) {
  let h = '<fieldset class="chips"><legend>' + esc(legend) + '</legend><div class="chipset">';
  options.forEach((o, i) => {
    const val = typeof o === "string" ? o : o[0];
    const lab = typeof o === "string" ? o : o[1];
    h += '<label class="chip"><input type="radio" name="' + name + '" id="' + name + "-" + i + '" value="' + esc(val) + '"' + (val === value ? " checked" : "") + "><span>" + esc(lab) + "</span></label>";
  });
  return h + "</div></fieldset>";
}
const radio = (name) => { const r = document.querySelector('input[name="' + name + '"]:checked'); return r ? r.value : ""; };
const val = (id) => ($(id) ? $(id).value.trim() : "");

function batchChoice(cur) {
  const chosen = cur || defaultBatch();
  if (state.batches.length === 1) return '<input type="hidden" id="f-b" value="' + esc(state.batches[0].id) + '">';
  const opts = state.batches.filter((b) => batchNow(b.id) > 0 || b.id === cur).map((b) => [b.id, b.name + " (" + fmt(batchNow(b.id)) + "টি)"]);
  return chips("f-batch", "কোন ব্যাচ?", opts, chosen);
}
const chosenBatch = () => ($("f-b") ? $("f-b").value : radio("f-batch"));
let editing = null; // entry being edited

  if (entry && !entry.id) { openForm(type, null); const r = document.querySelector('input[name="f-batch"][value="' + entry.b + '"]'); if (r) r.checked = true; return; }

/* ---------- saving ---------- */
function upsert(entry) {
  const i = state.entries.findIndex((x) => x.id === entry.id);
  if (i >= 0) state.entries[i] = entry; else state.entries.push(entry);
}
function formError(msg) { $("f-err").textContent = msg; }

function saveEntry(form) {
  const type = form.dataset.type;
  const d = val("f-date");
  if (!isDate(d)) return formError("তারিখ দিন।");
  if (d > todayISO()) return formError("ভবিষ্যতের তারিখ দেওয়া যাবে না।");
  const base = { id: editing ? editing.id : uid(), c: editing ? editing.c : Date.now(), t: type, d };
  const note = val("f-note");
  let extra = null, msg = "সেভ হয়েছে";
  let entry;
  if (type === "exp" || type === "inc") {
    const cat = radio("f-cat");
    if (!cat) return formError(type === "exp" ? "কিসের খরচ তা বেছে নিন।" : "কিসের আয় তা বেছে নিন।");
    const amount = toNum(val("f-amount"));
    if (!(amount > 0)) return formError("মোট টাকা লিখুন।");
    const qtyRaw = val("f-qty"); const qty = qtyRaw ? toNum(qtyRaw) : 0;
    if (qtyRaw && !(qty > 0)) return formError("পরিমাণ শুধু সংখ্যায় লিখুন।");
    entry = Object.assign(base, { cat, amount: Math.round(amount * 100) / 100, qty: qty || 0, unit: qty ? radio("f-unit") : "", note });
  } else if (type === "egg") {
    const count = toNum(val("f-count"));
    if (!(count >= 0) || !Number.isInteger(count)) return formError("কয়টি ডিম পাওয়া গেছে লিখুন।");
    const bRaw = val("f-broken"); const broken = bRaw ? toNum(bRaw) : 0;
    if (!(broken >= 0) || !Number.isInteger(broken) || broken > count) return formError("ভাঙা ডিম মোট ডিমের চেয়ে বেশি হতে পারে না।");
    entry = Object.assign(base, { count, broken, note });
  } else if (type === "flock") {
    const b = chosenBatch();
    if (!batchById(b)) return formError("কোন ব্যাচ তা বেছে নিন।");
    const kind = radio("f-kind");
    if (!kind) return formError("কী হয়েছে তা বেছে নিন।");
    const n = toNum(val("f-n"));
    if (!(n > 0) || !Number.isInteger(n)) return formError("কয়টি হাঁস তা লিখুন।");
    if (kind !== "add") {
      const now = batchNow(b, base.id);
      if (n > now) return formError((multi() ? batchById(b).name + "-এ" : "খামারে") + " এখন " + fmt(now) + "টি হাঁস আছে — এর বেশি কমানো যাবে না।");
    }
    entry = Object.assign(base, { b, kind, n, note });
    const sale = val("f-sale");
    if (!editing && kind === "sold" && sale) {
      const amount = toNum(sale);
      if (!(amount > 0)) return formError("বিক্রির টাকা শুধু সংখ্যায় লিখুন।");
      extra = { id: uid(), c: Date.now() + 1, t: "inc", d, cat: "হাঁস বিক্রি", amount: Math.round(amount * 100) / 100, qty: n, unit: "টি", note };
      msg = "সেভ হয়েছে — আয় খাতাতেও যোগ হলো";
    }
  } else if (type === "vac") {
    const b = chosenBatch();
    if (!batchById(b)) return formError("কোন ব্যাচ তা বেছে নিন।");
    const name = val("f-name");
    if (!name) return formError("টিকা বা ওষুধের নাম লিখুন।");
    const nRaw = val("f-n"); const n = nRaw ? toNum(nRaw) : 0;
    if (nRaw && !(n > 0)) return formError("হাঁসের সংখ্যা শুধু সংখ্যায় লিখুন।");
    const next = val("f-next");
    if (next && next <= d) return formError("পরের ডোজের তারিখ আজকের পরে হতে হবে।");
    entry = Object.assign(base, { b, name, n: n || 0, next: next || "", done: editing ? !!editing.done : false, note });
    const cost = val("f-cost");
    if (!editing && cost) {
      const amount = toNum(cost);
      if (!(amount > 0)) return formError("দাম শুধু সংখ্যায় লিখুন।");
      extra = { id: uid(), c: Date.now() + 1, t: "exp", d, cat: "ওষুধ ও টিকা", amount: Math.round(amount * 100) / 100, qty: 0, unit: "", note: name };
      msg = "সেভ হয়েছে — খরচ খাতাতেও যোগ হলো";
    }
  }
  upsert(entry);
  if (extra) upsert(extra);
  persist();
  closeSheet();
  listMonth = monthOf(d);
  render();
  toast(storageOK ? msg : "সেভ হয়নি — ব্রাউজারে জায়গা নেই");
}

/* ---------- sheets, dialogs, toast ---------- */
let sheetOpen = false;
function openSheet(html) {
  $("sheet").innerHTML = html;
  const w = $("sheetWrap");
  w.hidden = false;
  requestAnimationFrame(() => w.classList.add("open"));
  if (!sheetOpen) { sheetOpen = true; try { history.pushState({ sheet: 1 }, ""); } catch (e) { /* ignore */ } }
  const f = $("sheet").querySelector("input:not([type=date]):not([type=radio]), button.act");
  if (f && f.tagName === "BUTTON") f.focus();
}
function closeSheet(viaBack) {
  if (!sheetOpen) return;
  sheetOpen = false;
  editing = null;
  const w = $("sheetWrap");
  w.classList.remove("open");
  setTimeout(() => { if (!sheetOpen) { w.hidden = true; $("sheet").innerHTML = ""; } }, 180);
  if (!viaBack) { try { history.back(); } catch (e) { /* ignore */ } }
}
window.addEventListener("popstate", () => { if (sheetOpen) closeSheet(true); });

let dlgToken = 0;
function ask(message, okLabel, danger) {
  return new Promise((resolve) => {
    const w = $("dlgWrap");
    const my = ++dlgToken;
    $("dlg").innerHTML = '<p style="font-size:18px;margin:4px 0 16px">' + esc(message) + '</p><div class="sheet-actions"><button type="button" class="btn" id="dlg-no">না, থাক</button><button type="button" class="btn ' + (danger ? "danger" : "primary") + '" style="flex:1" id="dlg-yes">' + esc(okLabel) + "</button></div>";
    w.hidden = false;
    requestAnimationFrame(() => w.classList.add("open"));
    const done = (v) => { w.classList.remove("open"); setTimeout(() => { if (dlgToken === my) w.hidden = true; }, 180); resolve(v); };
    $("dlg-no").onclick = () => done(false);
    $("dlg-yes").onclick = () => done(true);
    $("dlg-no").focus();
  });
}

let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- backup, restore, Excel ---------- */
function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function shareFile(name, text, mime) {
  try {
    const file = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return "shared";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return "cancelled";
  }
  saveFile(name, text, mime);
  return "saved";
}
function backupText() { return JSON.stringify({ app: "hasher-khamar", v: 2, exportedAt: new Date().toISOString(), state }, null, 1); }
function markBackup() { state.settings.lastBackup = todayISO(); persist(); render(); }
async function doBackup(share) {
  const name = "hasher-khamar-backup-" + todayISO() + ".json";
  const r = share ? await shareFile(name, backupText(), "application/json") : (saveFile(name, backupText(), "application/json"), "saved");
  if (r === "cancelled") return;
  markBackup();
  toast(r === "shared" ? "ব্যাকআপ পাঠানো হয়েছে" : "ব্যাকআপ ফাইল ফোনের Download ফোল্ডারে সেভ হয়েছে");
}
function csvText() {
  const q = (v) => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const bName = (e) => (batchById(e.b) ? batchById(e.b).name : "");
  const rows = [["তারিখ", "কী", "ব্যাচ", "খাত / বিষয়", "টাকা", "পরিমাণ", "একক", "ডিম", "ভাঙা ডিম", "হাঁসের সংখ্যা", "পরের ডোজ", "মন্তব্য"]];
  const list = state.entries.slice().sort((a, b) => (a.d > b.d ? 1 : a.d < b.d ? -1 : (a.c || 0) - (b.c || 0)));
  for (const e of list) {
    if (e.t === "exp" || e.t === "inc") rows.push([e.d, TYPES[e.t], "", e.cat, e.amount, e.qty || "", e.unit || "", "", "", "", "", e.note || ""]);
    else if (e.t === "egg") rows.push([e.d, "ডিম", "", "", "", "", "", e.count, e.broken || 0, "", "", e.note || ""]);
    else if (e.t === "flock") rows.push([e.d, "হাঁস", bName(e), FLOCK[e.kind], "", "", "", "", "", (e.kind === "add" ? "" : "-") + e.n, "", e.note || ""]);
    else if (e.t === "vac") rows.push([e.d, "টিকা / ওষুধ", bName(e), e.name, "", "", "", "", "", e.n || "", e.next || "", e.note || ""]);
  }
  return "﻿" + rows.map((r) => r.map(q).join(",")).join("\r\n");
}
async function doCsv(share) {
  const name = "hasher-khamar-hisab-" + todayISO() + ".csv";
  const r = share ? await shareFile(name, csvText(), "text/csv") : (saveFile(name, csvText(), "text/csv"), "saved");
  if (r === "cancelled") return;
  toast(r === "shared" ? "Excel ফাইল পাঠানো হয়েছে" : "Excel ফাইল Download ফোল্ডারে সেভ হয়েছে");
}
function cleanState(s) {
  if (!s || typeof s !== "object" || !Array.isArray(s.entries) || !s.settings) return null;
  const okT = { exp: 1, inc: 1, egg: 1, flock: 1, vac: 1 };
  const entries = s.entries.filter((e) => e && okT[e.t] && isDate(e.d) && typeof e.id === "string").map((e) => {
    const n = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    const str = (v) => (typeof v === "string" ? v.slice(0, 300) : "");
    const o = { id: e.id.slice(0, 40), c: n(e.c), t: e.t, d: e.d, note: str(e.note) };
    if (e.t === "exp" || e.t === "inc") Object.assign(o, { cat: str(e.cat), amount: n(e.amount), qty: n(e.qty), unit: str(e.unit) });
    if (e.t === "egg") Object.assign(o, { count: n(e.count), broken: n(e.broken) });
    if (e.t === "flock" || e.t === "vac") o.b = str(e.b).slice(0, 40);
    if (e.t === "flock") { if (!FLOCK[e.kind]) return null; Object.assign(o, { kind: e.kind, n: n(e.n) }); }
    if (e.t === "vac") Object.assign(o, { name: str(e.name), n: n(e.n), next: isDate(e.next) ? e.next : "", done: !!e.done });
    return o;
  }).filter(Boolean);
  const st = s.settings;
  let batches = Array.isArray(s.batches) ? s.batches.filter((b) => b && typeof b.id === "string" && isDate(b.date)).map((b) => ({ id: b.id.slice(0, 40), name: (typeof b.name === "string" && b.name.trim() ? b.name : "ব্যাচ").slice(0, 40), date: b.date, age: Number.isFinite(Number(b.age)) ? Math.max(0, Math.round(Number(b.age))) : 0 })) : [];
  if (!batches.length) {
    // version 1 data: everything was one batch
    const adds = entries.filter((e) => e.t === "flock" && e.kind === "add").map((e) => e.d).sort();
    const date = isDate(st.arrivalDate) ? st.arrivalDate : adds[0] || (entries.map((e) => e.d).sort()[0]) || todayISO();
    batches = [{ id: "b1", name: "ব্যাচ ১", date, age: Number.isFinite(Number(st.arrivalAge)) ? Math.max(0, Math.round(Number(st.arrivalAge))) : 0 }];
  }
  const ids = new Set(batches.map((b) => b.id));
  for (const e of entries) if ((e.t === "flock" || e.t === "vac") && !ids.has(e.b)) e.b = batches[0].id;
  return { v: 2, settings: { farmName: typeof st.farmName === "string" ? st.farmName.slice(0, 80) : "আমার হাঁসের খামার", lastBackup: isDate(st.lastBackup) ? st.lastBackup : "" }, batches, entries };
}
$("restoreInput").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  let data = null;
  try { data = JSON.parse(await file.text()); } catch (e) { /* handled below */ }
  const s = data && data.app === "hasher-khamar" ? cleanState(data.state) : null;
  if (!s) { toast("এটি এই অ্যাপের ব্যাকআপ ফাইল নয়"); return; }
  if (state && state.entries.length) {
    const ok = await ask("এই ফোনের এখনকার হিসাব মুছে ব্যাকআপের " + fmt(s.entries.length) + "টি লেখা বসবে। ঠিক আছে?", "হ্যাঁ, ফেরত আনুন", true);
    if (!ok) return;
  }
  state = s;
  persist();
  tab = "home";
  render();
  toast(fmt(s.entries.length) + "টি লেখা ফেরত আনা হয়েছে");
});

/* ---------- events ---------- */
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) {
    if (ev.target === $("sheetWrap")) closeSheet();
    return;
  }
  const act = el.dataset.act;
  if (act === "tab") { tab = el.dataset.tab; if (tab === "list") listMonth = listMonth || curMonth(); render(); window.scrollTo(0, 0); }
  else if (act === "pick") openPicker();
  else if (act === "form") openForm(el.dataset.type);
  else if (act === "close") closeSheet();
  else if (act === "edit") { const e = state.entries.find((x) => x.id === el.dataset.id); if (e) openForm(e.t, e); }
  else if (act === "delete") {
    if (!editing) return;
    const id = editing.id;
    const ok = await ask("এই লেখাটি মুছে ফেলবেন?", "হ্যাঁ, মুছুন", true);
    if (!ok) return;
    state.entries = state.entries.filter((x) => x.id !== id);
    persist(); closeSheet(); render(); toast("মুছে ফেলা হয়েছে");
  }
  else if (act === "prevMonth") { listMonth = shiftMonth(listMonth, -1); render(); }
  else if (act === "nextMonth") { if (listMonth < curMonth()) { listMonth = shiftMonth(listMonth, 1); render(); } }
  else if (act === "filter") { listFilter = el.dataset.f; render(); }
  else if (act === "newBatch") openBatchForm(null);
  else if (act === "editBatch") { const b = batchById(el.dataset.id); if (b) openBatchForm(b); }
  else if (act === "deleteBatch") {
    if (!editingBatch) return;
    const b = editingBatch;
    const used = state.entries.filter((e) => e.b === b.id);
    const ok = await ask(b.name + " আর এর " + fmt(used.length) + "টি লেখা (হাঁস ও টিকা) মুছে যাবে। মুছবেন?", "হ্যাঁ, মুছুন", true);
    if (!ok) return;
    state.batches = state.batches.filter((x) => x.id !== b.id);
    state.entries = state.entries.filter((e) => e.b !== b.id);
    persist(); closeSheet(); render(); toast("ব্যাচ মুছে ফেলা হয়েছে");
  }
  else if (act === "fillName") { $("f-name").value = el.dataset.v; }
  else if (act === "vacDone") {
    const e = state.entries.find((x) => x.id === el.dataset.id);
    if (!e) return;
    e.done = true; persist(); render();
    openForm("vac", { b: e.b });
    editing = null;
    $("f-name").value = e.name;
    toast("এবারের ডোজটি লিখে সেভ করুন");
  }
  else if (act === "backupShare") doBackup(true);
  else if (act === "backupSave") doBackup(false);
  else if (act === "csvShare") doCsv(true);
  else if (act === "csvSave") doCsv(false);
  else if (act === "restore") $("restoreInput").click();
  else if (act === "install") {
    if (!installPrompt) return;
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) { /* ignore */ }
    installPrompt = null; render();
  }
  else if (act === "wipe") {
    const ok = await ask("সব হিসাব চিরতরে মুছে যাবে। ব্যাকআপ নিয়েছেন তো?", "হ্যাঁ, সব মুছুন", true);
    if (!ok) return;
    const ok2 = await ask("আবার জিজ্ঞেস করছি — সত্যিই সব মুছে ফেলবেন?", "সব মুছুন", true);
    if (!ok2) return;
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    state = null; tab = "home"; render();
  }
});

document.addEventListener("change", (ev) => {
  if (ev.target.name === "f-kind") { const b = $("saleBox"); if (b) b.hidden = ev.target.value !== "sold"; }
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "entryForm") saveEntry(f);
  else if (f.id === "batchForm") saveBatch();
  else if (f.id === "settingsForm") {
    const name = val("set-name") || "আমার হাঁসের খামার";
    state.settings.farmName = name.slice(0, 80);
    persist(); render(); toast("সেভ হয়েছে");
  } else if (f.id === "onbForm") {
    const name = val("onb-name") || "আমার হাঁসের খামার";
    const count = toNum(val("onb-count") || "0");
    const d = val("onb-date");
    const age = toNum(val("onb-age") || "0");
    const err = $("onb-err");
    if (!(count >= 0) || !Number.isInteger(count)) { err.textContent = "হাঁসের সংখ্যা শুধু সংখ্যায় লিখুন।"; return; }
    if (!isDate(d)) { err.textContent = "তারিখ দিন।"; return; }
    if (!(age >= 0)) { err.textContent = "বয়স শুধু সংখ্যায় লিখুন।"; return; }
    state = { v: 2, settings: { farmName: name.slice(0, 80), lastBackup: "" }, batches: [{ id: uid(), name: "ব্যাচ ১", date: d, age: Math.round(age) }], entries: [] };
    if (count > 0) state.entries.push({ id: uid(), c: Date.now(), t: "flock", d, b: state.batches[0].id, kind: "add", n: count, note: "শুরুর হাঁস / বাচ্চা" });
    persist();
    $("view").className = "wrap";
    tab = "home"; render();
    toast("খাতা তৈরি হয়েছে");
  }
});

document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && sheetOpen) closeSheet(); });

window.addEventListener("beforeinstallprompt", (ev) => { ev.preventDefault(); installPrompt = ev; if (state) render(); });
window.addEventListener("appinstalled", () => { installPrompt = null; toast("অ্যাপ ফোনে বসানো হয়েছে"); if (state) render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state && !sheetOpen) render(); });

/* ---------- start ---------- */
state = cleanState(load());
if (state) $("view").className = "wrap";
render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* app still works online */ });
}
})();
</script>
